stock_analytics:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('WAREHOUSE_HOST', 'localhost') }}"
      port: "{{ env_var('WAREHOUSE_PORT', '54332') | as_number }}"
      user: etl_user
      password: "{{ env_var('WAREHOUSE_PASSWORD') }}"
      dbname: stock_dw
      schema: public
      threads: 2